[project]
name = "py-buddy"
version = "0.1.0"
description = "Py-Buddy: grounded e-commerce consultation with NVFG, FIC, and Pareto relaxation"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/core", "src/experiments", "src"]
markers = [
    "live_model: requires the locally cached embedding model (gated by PYBUDDY_LIVE_LOCAL_MODEL=1)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "data", "docs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
